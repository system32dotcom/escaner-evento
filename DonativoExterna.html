<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Donar</title>
<style>
  :root{
    --tinta:#0f172a; --suave:#64748b; --linea:#e2e8f0; --fondo:#f8fafc;
    --acento:#16a34a; --acento2:#22c55e; --alerta:#d97706; --error:#dc2626;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:var(--fuente, -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif);
    background:var(--fondo); color:var(--tinta); line-height:1.5;
    padding:0 0 50px;
  }
  .wrap{max-width:520px;margin:0 auto;padding:0 16px}

  .hero{
    background:linear-gradient(160deg, var(--tinta), color-mix(in srgb, var(--tinta) 75%, var(--acento)));
    color:#fff; padding:28px 20px 24px; text-align:center; margin-bottom:18px;
  }
  .logoBanner{display:none;background:#fff;border-radius:14px;padding:10px 18px;margin:0 auto 12px;
    box-shadow:0 10px 26px rgba(0,0,0,.18)}
  .logoBanner.on{display:inline-block}
  .logoBanner img{max-height:40px;max-width:min(70vw,260px);object-fit:contain;display:block}
  .hero .evento{font-size:12px;text-transform:uppercase;letter-spacing:.1em;opacity:.65;margin-bottom:8px}
  .hero h1{font-size:24px;line-height:1.25;letter-spacing:-.01em;margin-bottom:14px}
  .miniBarra{background:rgba(255,255,255,.18);border-radius:999px;height:11px;overflow:hidden;margin-bottom:8px}
  .miniRelleno{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--acento2),#86efac);
    width:0%;transition:width 1s ease}
  .miniTexto{font-size:12.5px;opacity:.85;display:flex;justify-content:space-between}
  .miniTexto b{font-weight:700}

  .card{background:#fff;border:1px solid var(--linea);border-radius:14px;padding:20px;margin-bottom:14px}
  label{display:block;font-size:13px;font-weight:600;margin:0 0 10px;color:#334155}

  .metodos{display:flex;flex-direction:column;gap:10px}
  .btnSecundario{
    width:100%;padding:13px;border:1.5px solid #cbd5e1;border-radius:10px;font-size:14.5px;font-weight:650;
    cursor:pointer;font-family:inherit;background:#fff;color:var(--tinta);
    display:flex;align-items:center;justify-content:center;gap:8px
  }
  .btnSecundario.abierto{border-color:var(--tinta);background:#f8fafc}
  .panelDesplegable{
    max-height:0;overflow:hidden;transition:max-height .35s ease;
  }
  .panelDesplegable.abierto{max-height:600px}
  .panelInterno{padding:14px 2px 4px}
  .copiable{
    background:#f1f5f9;padding:11px 13px;border-radius:8px;font-family:ui-monospace,Menlo,monospace;
    font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:10px;margin:4px 0 16px;
    word-break:break-all
  }
  .copiable button{background:var(--tinta);color:#fff;border:0;border-radius:6px;padding:6px 11px;
    font-size:12px;cursor:pointer;font-family:inherit;white-space:nowrap}
  .datoApilado{text-align:center;margin-bottom:14px}
  .datoApilado .etiqueta{font-size:11.5px;font-weight:700;color:var(--suave);text-transform:uppercase;letter-spacing:.05em}
  .datoApilado .valor{font-size:15.5px;font-weight:700;margin-top:3px}
  .btnConfirmar{
    width:100%;padding:14px;border:0;border-radius:10px;background:var(--acento);color:#fff;
    font-size:15px;font-weight:700;cursor:pointer;font-family:inherit
  }
  .btnConfirmar:disabled{background:#94a3b8;cursor:not-allowed}

  .ticker{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;margin:4px 0 18px}
  .chipDonante{
    background:#f0fdf4;color:#166534;border:1px solid #bbf7d0;border-radius:999px;padding:6px 13px;
    font-size:12px;white-space:nowrap;flex-shrink:0
  }

  .aviso{padding:13px 15px;border-radius:9px;font-size:13.5px;margin:14px 0 0;line-height:1.5}
  .aviso.ok{background:#f0fdf4;color:#166534;border-left:3px solid var(--acento)}
  .aviso.info{background:#eff6ff;color:#1e40af;border-left:3px solid #3b82f6;white-space:pre-line}
  .oculto{display:none}
  .cargando{text-align:center;padding:60px 20px;color:var(--suave)}
  .avisoConfig{
    background:#7c2d12;color:#fed7aa;padding:13px 15px;border-radius:9px;font-size:13px;
    margin:14px 16px 0;line-height:1.5
  }
</style>
</head>
<body>

  <div id="avisoConfig" class="avisoConfig oculto">
    ⚠️ Falta configurar la URL del sistema en este archivo (constante <b>API_URL</b>, al inicio del
    &lt;script&gt;).
  </div>

  <div id="cargando" class="cargando">Cargando…</div>

  <div id="paso1" class="oculto">
    <div class="hero">
      <div class="logoBanner" id="logoBanner"><img id="logo"></div>
      <div class="evento" id="mEvento"></div>
      <h1 id="mCampana">Ayúdanos a lograrlo</h1>
      <div class="miniBarra"><div class="miniRelleno" id="miniRelleno"></div></div>
      <div class="miniTexto"><span id="miniRecaudado"></span><span id="miniMeta"></span></div>
    </div>

    <div class="wrap">
      <div id="ticker" class="ticker"></div>

      <div class="card">
        <label>Elige cómo donar</label>
        <div class="metodos">
          <button type="button" class="btnSecundario" id="optTransferencia">🏦 Transferencia bancaria</button>
          <button type="button" class="btnSecundario" id="optEfectivo">💳💵 Efectivo o Tarjeta en el evento</button>
        </div>

        <div class="panelDesplegable" id="panelTransferencia">
          <div class="panelInterno">
            <div class="datoApilado"><div class="etiqueta">CLABE</div></div>
            <div class="copiable"><span id="pvClabe"></span><button onclick="copiar('pvClabe',this)">Copiar</button></div>

            <div class="datoApilado">
              <div class="etiqueta">Banco</div>
              <div class="valor" id="pvBanco"></div>
            </div>
            <div class="datoApilado">
              <div class="etiqueta">Beneficiario</div>
              <div class="valor" id="pvBenef"></div>
            </div>

            <div class="datoApilado"><div class="etiqueta">Concepto</div></div>
            <div class="copiable"><span id="pvConcepto">Generando…</span><button onclick="copiar('pvConcepto',this)">Copiar</button></div>

            <button class="btnConfirmar" id="btnDonarTransferencia" disabled>Confirmar transferencia</button>
            <div class="aviso ok" id="avisoTransferencia">Después de realizar tu transferencia, vuelve para confirmarla, o hazlo directamente con el staff de donación.</div>
          </div>
        </div>

        <div class="panelDesplegable" id="panelEfectivo">
          <div class="panelInterno">
            <div class="aviso info" id="mensajeEfectivoPreview"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

<script>
/* Pega aquí la URL de tu aplicación web de Apps Script, terminada en /exec. */
var API_URL = 'https://script.google.com/macros/s/AKfycbx47wiWLThmArQIirAXMtA6xAytZphK8q0sQ0fnOQmCqUz5WCBwe700pizTMOp-vD2K/exec';

if (!API_URL || API_URL.indexOf('PEGA_AQUI') >= 0) {
  document.getElementById('avisoConfig').classList.remove('oculto');
}

/* Vive fuera de Apps Script (GitHub Pages) por el mismo motivo que ReservaExterna.html y
   ScannerExterno.html: Safari/iOS no puede abrir apps web completas de Apps Script. GET,
   no POST — un POST pierde su cuerpo al seguir la redirección 302 de las apps web. */
function llamarApi(accion, datos){
  var payload = Object.assign({p: 'apiPublica', accion: accion}, datos || {});
  var qs = Object.keys(payload).map(function(k){
    var v = payload[k];
    if (v === undefined || v === null) v = '';
    if (typeof v === 'object') v = JSON.stringify(v);
    return encodeURIComponent(k) + '=' + encodeURIComponent(v);
  }).join('&');
  return fetch(API_URL + '?' + qs).then(function(r){
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  });
}

var EV = null;

llamarApi('datosCampanaDonativos', {}).then(function(d){
  EV = d;
  document.documentElement.style.setProperty('--acento', d.colorPrincipal || '#16a34a');
  if(d.fuenteGoogle){
    var l = document.createElement('link');
    l.rel = 'stylesheet';
    l.href = 'https://fonts.googleapis.com/css2?family=' +
      encodeURIComponent(d.fuenteGoogle).replace(/%20/g,'+') + ':wght@400;600;700&display=swap';
    document.head.appendChild(l);
    document.documentElement.style.setProperty('--fuente', "'" + d.fuenteGoogle + "', sans-serif");
  }
  if(d.urlLogo){
    document.getElementById('logo').src = d.urlLogo;
    document.getElementById('logoBanner').classList.add('on');
  }
  document.getElementById('mEvento').textContent = d.nombreEvento;
  document.getElementById('mCampana').textContent = d.nombreCampana || 'Ayúdanos a lograrlo';
  document.getElementById('pvClabe').textContent = d.clabe;
  document.getElementById('pvBanco').textContent = d.banco;
  document.getElementById('pvBenef').textContent = d.beneficiario;
  document.getElementById('mensajeEfectivoPreview').textContent = d.mensajeEfectivo;

  var metodos = d.metodosActivos || [];
  if(metodos.indexOf('TRANSFERENCIA') < 0) document.getElementById('optTransferencia').classList.add('oculto');
  if(metodos.indexOf('EFECTIVO') < 0) document.getElementById('optEfectivo').classList.add('oculto');

  cargarProgreso();
  document.getElementById('cargando').classList.add('oculto');
  document.getElementById('paso1').classList.remove('oculto');
}).catch(function(){
  document.getElementById('cargando').textContent = 'No pudimos cargar la campaña. Revisa tu conexión.';
});

function cargarProgreso(){
  llamarApi('progresoDonativos', {}).then(function(r){
    if(!r || !r.ok) return;
    document.getElementById('miniRelleno').style.width = r.porcentaje+'%';
    document.getElementById('miniRecaudado').innerHTML = '<b>'+money(r.recaudado)+'</b> recaudados';
    document.getElementById('miniMeta').textContent = 'Meta: '+money(r.meta);
    document.getElementById('ticker').innerHTML = (r.ultimos||[]).map(function(u){
      return '<div class="chipDonante">🎁 '+u.nombre+' donó '+money(u.monto)+'</div>';
    }).join('');
  });
}

function money(n){ return '$'+Number(n||0).toLocaleString('es-MX',{maximumFractionDigits:0}); }

// ---- Acordeones de método ----
// Efectivo es solo informativo. Transferencia muestra un código de concepto
// generado AQUÍ MISMO en el navegador (no en el servidor) en cuanto se abre
// el panel — por seguridad, el donativo como tal (el registro en la hoja)
// solo se crea hasta que la persona de verdad confirma que ya transfirió, no
// antes, para no llenar la base de datos de intentos que nunca se completaron.
var codigoTransferencia = null;
var donativoTransferenciaID = null;

function generarCodigoTransferencia(){
  var letras = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // sin 0/O ni 1/I para que no se confundan al copiarlo a mano
  var s = '';
  for(var i=0; i<6; i++) s += letras.charAt(Math.floor(Math.random()*letras.length));
  return s;
}

function cerrarPaneles(){
  ['panelTransferencia','panelEfectivo'].forEach(function(id){
    document.getElementById(id).classList.remove('abierto');
  });
  ['optTransferencia','optEfectivo'].forEach(function(id){
    document.getElementById(id).classList.remove('abierto');
  });
}
document.getElementById('optTransferencia').onclick = function(){
  var yaAbierto = this.classList.contains('abierto');
  cerrarPaneles();
  if(yaAbierto) return;
  this.classList.add('abierto');
  document.getElementById('panelTransferencia').classList.add('abierto');
  if(!codigoTransferencia){
    codigoTransferencia = generarCodigoTransferencia();
    document.getElementById('pvConcepto').textContent = codigoTransferencia;
    document.getElementById('btnDonarTransferencia').disabled = false;
  }
};
document.getElementById('optEfectivo').onclick = function(){
  var yaAbierto = this.classList.contains('abierto');
  cerrarPaneles();
  if(!yaAbierto){ this.classList.add('abierto'); document.getElementById('panelEfectivo').classList.add('abierto'); }
};

document.getElementById('btnDonarTransferencia').onclick = function(){
  if(!codigoTransferencia || donativoTransferenciaID) return; // ya confirmado, no duplicar
  var btn = this;
  btn.disabled = true; btn.textContent = 'Registrando...';
  llamarApi('confirmarDonativoTransferencia', {codigo: codigoTransferencia}).then(function(r){
    if(!r.ok){ btn.disabled = false; btn.textContent = 'Confirmar transferencia'; return; }
    donativoTransferenciaID = r.donativoID;
    btn.textContent = '✓ Transferencia confirmada';
    document.getElementById('avisoTransferencia').textContent =
      'Anotado. En cuanto confirmemos el monto, verás tu aporte reflejado en la meta. ¡Gracias!';
  }).catch(function(){
    btn.disabled = false; btn.textContent = 'Confirmar transferencia';
  });
};

function copiar(id, btn){
  var t = document.getElementById(id).textContent;
  var ta = document.createElement('textarea');
  ta.value = t; document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); btn.textContent='Copiado';
    setTimeout(function(){btn.textContent='Copiar'},1600); }catch(e){}
  document.body.removeChild(ta);
}

// "en tiempo real": refresca el termómetro solo, sin que el usuario haga nada.
setInterval(cargarProgreso, 5000);
</script>
</body>
</html>
